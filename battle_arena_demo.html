<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Battle Arena Demo</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#8da875;color:white;font-family:system-ui;touch-action:none}canvas{width:100vw;height:100vh;display:block}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill,button{background:#12232bd9;color:white;border:1px solid #ffffff66;border-radius:12px;padding:9px 12px}.pill{font-size:13px}#controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}#stick{width:124px;height:124px;border-radius:50%;background:#12232b77;border:2px solid #ffffff88;position:relative;touch-action:none}#knob{position:absolute;left:37px;top:37px;width:46px;height:46px;border-radius:50%;background:#f2f5e5dd}#fire{width:82px;height:82px;border-radius:50%;background:#c9433ddd;font-weight:bold}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#081016cc;padding:22px;text-align:center}#panel{max-width:390px;background:#15252d;border:1px solid #ffffff44;border-radius:18px;padding:22px}#panel button{background:#d7ef83;color:#19251a;font-weight:bold;padding:12px 22px}#hint{position:fixed;top:60px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#12232bd9;padding:7px 10px;border-radius:9px;font-size:12px}</style></head><body><canvas id="c"></canvas><div id="hud"><div class="pill" id="stats">❤️ 100　🎯 0/8</div><div class="pill">BATTLE ARENA · DEMO</div><button id="reset">↻ Restart</button></div><div id="hint">চলো: WASD/Arrow বা joystick · গুলি: Space/FIRE</div><div id="controls"><div id="stick"><div id="knob"></div></div><button id="fire">FIRE</button></div><div id="overlay"><div id="panel"><h1>⚔️ BATTLE ARENA</h1><p>নিজস্ব Battle Royale গেমের প্রথম playable demo। ছোট ম্যাপ, চরিত্র, চলাফেরা, গুলি ও বট শত্রু আছে।<br><br><b>এটি এখন একা খেলার demo।</b> Online Duo যোগ করতে পরের ধাপে multiplayer server লাগবে।</p><button id="start">গেম শুরু করো</button></div></div><script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),stats=document.querySelector('#stats');let W,H,started=false,over=false,keys={},joy={x:0,y:0},fire=false,last=0,score=0,bullets=[],bots=[],trees=[],cam={x:900,y:650};const map={w:1800,h:1300};let p;function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}onresize=size;size();function reset(){p={x:900,y:650,r:17,hp:100,angle:0,cool:0};score=0;bullets=[];bots=[];trees=[];for(let i=0;i<8;i++){let a=Math.random()*6.28,d=260+Math.random()*420;bots.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:15,hp:50,cool:Math.random(),speed:38+Math.random()*20})}for(let i=0;i<40;i++)trees.push({x:70+Math.random()*1660,y:70+Math.random()*1160,r:12+Math.random()*22,rock:Math.random()<.3});over=false}reset();function shoot(o,a,enemy=false){bullets.push({x:o.x+Math.cos(a)*22,y:o.y+Math.sin(a)*22,vx:Math.cos(a)*(enemy?260:510),vy:Math.sin(a)*(enemy?260:510),life:1.5,enemy})}function draw(){g.clearRect(0,0,W,H);g.fillStyle='#8eaa76';g.fillRect(0,0,W,H);let L=cam.x-W/2,T=cam.y-H/2;for(let x=Math.floor(L/70)*70;x<L+W;x+=70)for(let y=Math.floor(T/70)*70;y<T+H;y+=70){g.strokeStyle='#7f9b68';g.beginPath();g.moveTo(x-L+5,y-T+5);g.lineTo(x-L+12,y-T+2);g.stroke()}g.strokeStyle='#e6e7c9';g.lineWidth=6;g.strokeRect(-L,-T,map.w,map.h);for(let t of trees){let x=t.x-L,y=t.y-T;if(x< -50||x>W+50||y< -50||y>H+50)continue;if(t.rock){g.fillStyle='#7b8983';g.beginPath();g.ellipse(x,y,t.r,t.r*.65,-.2,0,6.28);g.fill()}else{g.fillStyle='#315d3b';g.beginPath();g.arc(x+2,y+5,t.r,0,6.28);g.fill();g.fillStyle='#477d4a';g.beginPath();g.arc(x-4,y-4,t.r*.65,0,6.28);g.fill()}}for(let b of bullets){g.fillStyle=b.enemy?'#ffb36b':'#fff1a1';g.beginPath();g.arc(b.x-L,b.y-T,4,0,6.28);g.fill()}for(let e of bots)if(e.hp>0){let x=e.x-L,y=e.y-T;g.fillStyle='#b64d43';g.beginPath();g.arc(x,y,e.r,0,6.28);g.fill();g.fillStyle='#f0c7a0';g.beginPath();g.arc(x+2,y-4,8,0,6.28);g.fill();g.fillStyle='#1d3036';g.fillRect(x-11,y-23,22,4);g.fillStyle='#ef6c5b';g.fillRect(x-11,y-23,22*Math.max(0,e.hp/50),4)}let x=p.x-L,y=p.y-T;g.save();g.translate(x,y);g.rotate(p.angle);g.fillStyle='#e0e9e7';g.fillRect(0,-5,27,10);g.fillStyle='#397786';g.beginPath();g.arc(0,0,p.r,0,6.28);g.fill();g.fillStyle='#d7b797';g.beginPath();g.arc(5,-3,9,0,6.28);g.fill();g.fillStyle='#d8ef82';g.fillRect(7,-4,22,5);g.restore();g.fillStyle='#15262bc9';g.fillRect(W-118,76,104,76);g.strokeStyle='#ffffff88';g.strokeRect(W-118,76,104,76);g.fillStyle='#e1f28a';g.beginPath();g.arc(W-118+p.x/map.w*104,76+p.y/map.h*76,3,0,6.28);g.fill();g.fillStyle='#ee786b';for(let e of bots)if(e.hp>0){g.beginPath();g.arc(W-118+e.x/map.w*104,76+e.y/map.h*76,2,0,6.28);g.fill()}}
function update(dt){if(!started||over)return;let dx=((keys.d||keys.ArrowRight)?1:0)-((keys.a||keys.ArrowLeft)?1:0)+joy.x,dy=((keys.s||keys.ArrowDown)?1:0)-((keys.w||keys.ArrowUp)?1:0)+joy.y,n=Math.hypot(dx,dy);if(n>1){dx/=n;dy/=n}if(n>.05){p.x=Math.max(20,Math.min(map.w-20,p.x+dx*220*dt));p.y=Math.max(20,Math.min(map.h-20,p.y+dy*220*dt));p.angle=Math.atan2(dy,dx)}cam.x=p.x;cam.y=p.y;p.cool-=dt;if((fire||keys[' ']||keys.Enter)&&p.cool<=0){let target=null,best=600;for(let e of bots)if(e.hp>0){let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<best){best=d;target=e}}if(target){p.angle=Math.atan2(target.y-p.y,target.x-p.x);shoot(p,p.angle);p.cool=.24}else if(n>.05){shoot(p,p.angle);p.cool=.24}}for(let e of bots)if(e.hp>0){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx);if(d>150){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}e.cool-=dt;if(d<420&&e.cool<=0){shoot(e,a,true);e.cool=1.4+Math.random()}}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.enemy&&Math.hypot(b.x-p.x,b.y-p.y)<p.r+4){p.hp-=10;b.life=0}else if(!b.enemy)for(let e of bots)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.hp-=25;b.life=0;if(e.hp<=0)score++}}bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.y>0&&b.x<map.w&&b.y<map.h);stats.textContent=`❤️ ${Math.max(0,Math.ceil(p.hp))}　🎯 ${score}/8`;if(p.hp<=0||bots.every(e=>e.hp<=0)){over=true;document.querySelector('#panel').innerHTML=`<h1>${p.hp>0?'🏆 তুমি জিতেছ!':'💥 ম্যাচ শেষ'}</h1><p>তুমি ${score} জন বটকে হারিয়েছ। Online Duo পরের ধাপে যোগ হবে।</p><button id="again">আবার খেলো</button>`;document.querySelector('#again').onclick=()=>{reset();document.querySelector('#overlay').style.display='none';last=performance.now();requestAnimationFrame(loop)};document.querySelector('#overlay').style.display='flex'}}function loop(t){let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();if(started&&!over)requestAnimationFrame(loop)}document.querySelector('#start').onclick=()=>{started=true;document.querySelector('#overlay').style.display='none';last=performance.now();requestAnimationFrame(loop)};document.querySelector('#reset').onclick=()=>{reset();if(!started){started=true;document.querySelector('#overlay').style.display='none'}last=performance.now();requestAnimationFrame(loop)};onkeydown=e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()};onkeyup=e=>keys[e.key]=false;let stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),active=false;function move(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=39,d=Math.hypot(dx,dy);if(d>m){dx=dx/d*m;dy=dy/d*m}joy.x=dx/m;joy.y=dy/m;knob.style.left=(r.width/2-23+dx)+'px';knob.style.top=(r.height/2-23+dy)+'px'}stick.onpointerdown=e=>{active=true;stick.setPointerCapture(e.pointerId);move(e)};stick.onpointermove=e=>{if(active)move(e)};function end(){active=false;joy={x:0,y:0};knob.style.left='37px';knob.style.top='37px'}stick.onpointerup=end;stick.onpointercancel=end;let fb=document.querySelector('#fire');fb.onpointerdown=e=>{fire=true;fb.setPointerCapture(e.pointerId)};fb.onpointerup=fb.onpointercancel=()=>fire=false;})();</script></body></html>
